services:
  - type: web
    name: sf-e2e-dashboard
    runtime: node
    buildCommand: npm install && PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install chromium
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: '0'
      - key: ECA_PRIVATE_KEY_BASE64
        sync: false
